<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph with Reset Button</title>
    <style>
        #cy {
            width: 100%;
            height: 25vh;
            border: 1px solid #ccc;
        }

        #controls {
            text-align: center;
            margin: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        /* Tooltip styling */
        .cy-tooltip {
            position: absolute;
            padding: 8px;
            background-color: #333;
            color: #fff;
            border-radius: 4px;
            font-size: 12px;
            display: none;
            /* Ensure the tooltip is hidden by default */
            pointer-events: none;
            /* Allow mouse interactions to pass through */
            z-index: 10;
        }
    </style>
    <!-- Cytoscape.js Core -->
    <link rel="stylesheet" href="datatable.css"> <!-- Link to external CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.20.0/dist/cytoscape.min.js"></script>
    <!-- Dependencies for fcose -->
    <script src="https://unpkg.com/layout-base/layout-base.js"></script>
    <script src="https://unpkg.com/cose-base/cose-base.js"></script>
    <!-- fcose layout -->
    <script src="https://unpkg.com/cytoscape-fcose/cytoscape-fcose.js"></script>
    <script src="datatable.js"></script>
</head>

<body>
    <h1>Graph with Reset Button and Enhanced DataTable</h1>
    <div id="controls">
        <button id="restructure">Restructure Graph</button>
        <button id="reset">Reset Layout</button>
    </div>
    <div id="cy"></div>
    <div class="cy-tooltip" id="cy-tooltip"></div> <!-- Tooltip div -->
    <div id="datatable-container-selected">
        <table id="datatable-selected" class="display compact cell-border" style="width:100%">
            <thead>
                <tr id="datatable-head-selected"></tr> <!-- Dynamic column headers will be added here -->
                <tr id="datatable-filter-row-selected"></tr> <!-- Dynamic filter inputs will be added here -->
            </thead>
            <tbody>
                <!-- Rows will be added dynamically by DataTables -->
            </tbody>
        </table>
    </div>
    <div id="datatable-container-unselected">
        <table id="datatable-unselected" class="display compact cell-border" style="width:100%">
            <thead>
                <tr id="datatable-head-unselected"></tr> <!-- Dynamic column headers will be added here -->
                <tr id="datatable-filter-row-unselected"></tr> <!-- Dynamic filter inputs will be added here -->
            </thead>
            <tbody>
                <!-- Rows will be added dynamically by DataTables -->
            </tbody>
        </table>
    </div>

    <script src="cluster_0_graph.js"></script>
    <script>
        const flattenNodeData = (nodeData) => {
            const rows = [];
            nodeData.forEach((node) => {
                const data = node.data;

                // Check if any attribute is a list
                const keys = Object.keys(data).filter(key => Array.isArray(data[key]));

                // If there are lists, flatten them into multiple rows
                if (keys.length > 0) {
                    // Get the maximum length of lists
                    const maxLength = Math.max(...keys.map(key => data[key].length));

                    for (let i = 0; i < maxLength; i++) {
                        const row = {};
                        Object.entries(data).forEach(([key, value]) => {
                            // If it's a list, get the i-th element; otherwise, use the value
                            row[key] = Array.isArray(value) ? (value[i] || '') : value;
                        });
                        rows.push(row);
                    }
                } else {
                    // If no lists, add a single row for the node
                    rows.push(data);
                }
            });
            return rows;
        };






        document.addEventListener("DOMContentLoaded", () => {
            const selectedNodes = new Set(); // Track selected nodes

            // Flatten the node data for the DataTable
            const nodeData = data.nodes;
            const flattenedRows = flattenNodeData(nodeData);

            // Separate data into selected and unselected
            let selectedRows = [];
            let unselectedRows = [...flattenedRows];

            const columnTitleMap = {
                BorrowerName: "Borrower Name",
                BorrowerAddress: "Borrower Address",
                BorrowerCity: "Borrower City"
            };



            DataTableManager.initializeDataTable({
                rows: unselectedRows,
                tableId: 'datatable-unselected',
                tableHeadId: 'datatable-head-unselected',
                filterRowId: 'datatable-filter-row-unselected',
                columnTitleMap: columnTitleMap,
                callback: (dataTable) => console.log("Unselected table initialized")
            });



            // Initialize Cytoscape
            const cy = cytoscape({
                container: document.getElementById('cy'),
                elements: data,
                style: [
                    {
                        selector: 'node',
                        style: {
                            'background-color': '#0074D9',
                            'width': 'mapData(size, 10, 100, 10, 50)',
                            'height': 'mapData(size, 10, 100, 10, 50)'
                        }
                    },
                    {
                        selector: 'edge',
                        style: {
                            'line-color': '#888',
                            'width': 2
                        }
                    },
                    {
                        selector: '.selected',
                        style: {
                            'background-color': '#FFD700',
                            'border-color': '#FFA500',
                            'border-width': 2
                        }
                    }
                ],
                layout: {
                    name: 'fcose',
                    animate: true
                }
            });

            // Move node to Selected Table
            const moveToSelected = (nodeId) => {
                // Find all rows corresponding to the nodeId
                const rowsToMove = unselectedRows.filter(row => row.id === nodeId);
                if (rowsToMove.length > 0) {
                    // Remove the rows from unselectedRows
                    unselectedRows = unselectedRows.filter(row => row.id !== nodeId);

                    // Add rows to selectedRows
                    selectedRows.push(...rowsToMove);

                    // Update tables
                    DataTableManager.getInstance('datatable-unselected').clear().rows.add(unselectedRows).draw();

                    // Reinitialize or update the selected table
                    DataTableManager.initializeDataTable({
                        rows: selectedRows,
                        tableId: 'datatable-selected',
                        tableHeadId: 'datatable-head-selected',
                        filterRowId: 'datatable-filter-row-selected',
                        columnTitleMap: columnTitleMap,
                        callback: (dataTable) => console.log("Selected table updated")
                    });
                }
            };

            // Move node to Unselected Table
            const moveToUnselected = (nodeId) => {
                // Find all rows corresponding to the nodeId
                const rowsToMove = selectedRows.filter(row => row.id === nodeId);
                if (rowsToMove.length > 0) {
                    // Remove the rows from selectedRows
                    selectedRows = selectedRows.filter(row => row.id !== nodeId);

                    // Add rows to unselectedRows
                    unselectedRows.push(...rowsToMove);

                    // Update tables
                    DataTableManager.getInstance('datatable-selected').clear().rows.add(selectedRows).draw();
                    DataTableManager.getInstance('datatable-unselected').clear().rows.add(unselectedRows).draw();
                }
            };

            // Cytoscape Node Click Event
            cy.on('tap', 'node', function (event) {
                const node = event.target;
                const nodeId = node.data('id');

                if (selectedNodes.has(nodeId)) {
                    selectedNodes.delete(nodeId);
                    node.removeClass('selected');
                    moveToUnselected(nodeId);
                } else {
                    selectedNodes.add(nodeId);
                    node.addClass('selected');
                    moveToSelected(nodeId);
                }
            });

            // Handle Row Click in Unselected Table
            $('#datatable-unselected tbody').on('click', 'tr', function () {
                const rowData = DataTableManager.getInstance('datatable-unselected').row(this).data();
                const nodeId = rowData.id;

                // Select Node in Cytoscape
                cy.$(`node[id="${nodeId}"]`).addClass('selected');
                selectedNodes.add(nodeId);

                // Move to Selected Table
                moveToSelected(nodeId);
            });

            // Handle Row Click in Selected Table
            $('#datatable-selected tbody').on('click', 'tr', function () {
                const rowData = DataTableManager.getInstance('datatable-selected').row(this).data();
                const nodeId = rowData.id;

                // Deselect Node in Cytoscape
                cy.$(`node[id="${nodeId}"]`).removeClass('selected');
                selectedNodes.delete(nodeId);

                // Move to Unselected Table
                moveToUnselected(nodeId);
            });
            // Tooltip setup
            const tooltip = document.getElementById('cy-tooltip');

            cy.on('mouseover', 'node', (event) => {
                const node = event.target;
                tooltip.innerHTML = node.data('id'); // Set tooltip content
                tooltip.style.display = 'block'; // Show the tooltip
            });

            cy.on('mousemove', 'node', (event) => {
                const pos = event.renderedPosition; // Get rendered position of the node
                tooltip.style.left = `${pos.x + 15}px`; // Adjust tooltip position
                tooltip.style.top = `${pos.y + 15}px`;
            });

            cy.on('mouseout', 'node', () => {
                tooltip.style.display = 'none'; // Hide the tooltip when not hovering
            });

            // Add event listener for restructuring the graph
            document.getElementById('restructure').addEventListener('click', () => {
                cy.layout({
                    name: 'fcose', // Apply fcose layout again
                    randomize: true,
                    animate: true,
                    idealEdgeLength: 150,
                    nodeRepulsion: 4500,
                    fit: true,
                    padding: 10
                }).run();
            });

            // Add event listener for resetting the graph layout
            document.getElementById('reset').addEventListener('click', () => {
                cy.layout({
                    name: 'grid', // Use a simple grid layout for resetting
                    fit: true,
                    padding: 10
                }).run();
            });

        });


    </script>
</body>

</html>
