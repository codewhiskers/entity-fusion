        <script type="text/javascript">

              // initialize global variables.

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#23d6ee", "font": {"color": "white"}, "id": "R3", "label": "R3", "shape": "dot", "title": "Record: R3"}, {"color": "#23d6ee", "font": {"color": "white"}, "id": "R6", "label": "R6", "shape": "dot", "title": "Record: R6"}, {"color": "#f66a74", "font": {"color": "white"}, "id": "R4", "label": "R4", "shape": "dot", "title": "Record: R4"}, {"color": "#f66a74", "font": {"color": "white"}, "id": "R5", "label": "R5", "shape": "dot", "title": "Record: R5"}, {"color": "#23d6ee", "font": {"color": "white"}, "id": "R2", "label": "R2", "shape": "dot", "title": "Record: R2"}, {"color": "#23d6ee", "font": {"color": "white"}, "id": "R1", "label": "R1", "shape": "dot", "title": "Record: R1"}]);
                  edges = new vis.DataSet([{"from": "R3", "title": "Score: 1.84, Signals: [\u0027NAME_KEY_COSINE\u0027, \u0027PHONE\u0027]", "to": "R6", "value": 1.836472236621213}, {"from": "R6", "title": "Score: 1.84, Signals: [\u0027PHONE\u0027]", "to": "R2", "value": 1.836472236621213}, {"from": "R6", "title": "Score: 1.84, Signals: [\u0027PHONE\u0027]", "to": "R1", "value": 1.836472236621213}, {"from": "R4", "title": "Score: 2.35, Signals: [\u0027NAME_KEY_COSINE\u0027, \u0027PHONE\u0027]", "to": "R5", "value": 2.3472978603872034}]);

                  nodeColors = {};

                  for (nodeId in allNodes) {

                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {

            "fit": true,
            "iterations": 1000,

            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;
